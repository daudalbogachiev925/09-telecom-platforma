version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tel
      POSTGRES_PASSWORD: tel
      POSTGRES_DB: tel
    ports: ["5432:5432"]
  api:
    build: ./api
    ports: ["8000:8000"]
    depends_on: [postgres]
    command: uvicorn main:app --host 0.0.0.0 --port 8000
